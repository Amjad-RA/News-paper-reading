name: Save daily headlines

# Runs only when you press "Run workflow" in the Actions tab.
# The automatic daily schedule is off because this site is public: copying a
# news site's headlines every day onto a public page goes beyond personal use.
# Make the repository private before switching it back on:
#   schedule:
#     - cron: "17 1 * * *"   # 06:47 IST every day
on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Keep headlines from the last N days (0 = keep everything)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: headlines
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/fetch_headlines.py
        env:
          KEEP_DAYS: ${{ inputs.keep_days }}
      - name: Commit if changed
        run: |
          git add feed.js
          if git diff --cached --quiet; then echo "No new headlines"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily headlines $(TZ=Asia/Kolkata date +%F)"
          git push
