<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Days of The Hindu</title>
<meta name="description" content="Short notes on The Hindu headlines with Malayalam meanings, 100 days.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600&family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface-2: #f0ede6;
    --text: #1d1b18;
    --muted: #6b665d;
    --border: #e2ddd3;
    --accent: #1f4e8c;
    --accent-soft: #e4ecf7;
    --ml: #7a3e00;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413;
      --surface: #1d1d1b;
      --surface-2: #262623;
      --text: #ece9e2;
      --muted: #a29d93;
      --border: #34332f;
      --accent: #8cb4ec;
      --accent-soft: #22324a;
      --ml: #f0b37a;
      --shadow: none;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413;
    --surface: #1d1d1b;
    --surface-2: #262623;
    --text: #ece9e2;
    --muted: #a29d93;
    --border: #34332f;
    --accent: #8cb4ec;
    --accent-soft: #22324a;
    --ml: #f0b37a;
    --shadow: none;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .ml { font-family: "Noto Sans Malayalam", sans-serif; color: var(--ml); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }

  header { padding: 32px 0 16px; }
  .kicker { color: var(--muted); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  h1 { font-family: "Source Serif 4", Georgia, serif; font-size: clamp(28px, 6vw, 40px); line-height: 1.15; margin: 6px 0 4px; }
  .sub { margin: 0; color: var(--muted); }
  .sub .ml { color: var(--muted); }

  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0 0; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font-size: 14px; color: var(--muted); }
  .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
  .progress { height: 6px; background: var(--surface-2); border-radius: 99px; margin-top: 14px; overflow: hidden; }
  .progress > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s; }

  .toolbar {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .search { flex: 1 1 220px; position: relative; }
  .search input {
    width: 100%; font: inherit; padding: 10px 12px 10px 36px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--text);
  }
  .search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .seg { flex: none; display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
  .seg button {
    font: inherit; font-size: 14px; font-weight: 500; border: 0; background: none; color: var(--muted);
    padding: 9px 14px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .icon-btn {
    flex: none; font: inherit; font-size: 14px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--muted); padding: 9px 12px; cursor: pointer;
  }
  .icon-btn:hover, .seg button:hover { color: var(--text); }

  main { padding: 16px 0 48px; }

  /* List view */
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .list li { display: grid; grid-template-columns: 64px 1fr; gap: 4px 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
  .list li:first-child { border-top: 0; }
  .list .dayno { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
  .list .dayno b { display: block; color: var(--accent); font-size: 15px; }
  .list .t { font-weight: 600; }
  .list .t a { color: inherit; text-decoration: none; }
  .list .t a:hover { text-decoration: underline; }
  .list .ml { font-size: 15px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }

  /* Detailed view: accordion */
  .acc { display: flex; flex-direction: column; gap: 10px; }
  details.day { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  details.day > summary {
    list-style: none; cursor: pointer; padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
  }
  details.day > summary::-webkit-details-marker { display: none; }
  .badge { flex: none; width: 44px; height: 44px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sum-main { flex: 1; min-width: 0; }
  .sum-main .d { font-weight: 600; }
  .sum-main .c { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { flex: none; color: var(--muted); transition: transform .2s; }
  details[open] .chev { transform: rotate(180deg); }
  .items { padding: 0 16px 8px; }
  .item { border-top: 1px solid var(--border); padding: 14px 0; }
  .item h3 { font-family: "Source Serif 4", Georgia, serif; font-size: 18px; line-height: 1.3; margin: 0 0 4px; }
  .item h3 a { color: inherit; text-decoration: none; }
  .item h3 a:hover { text-decoration: underline; }
  .item .ml.mean { font-size: 16px; font-weight: 600; margin: 0 0 6px; }
  .item p { margin: 4px 0; }
  .item .note { color: var(--text); }
  .item .noteml { font-size: 15px; color: var(--muted); }
  .words { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; padding: 0; list-style: none; }
  .words li { background: var(--surface-2); border-radius: 8px; padding: 3px 9px; font-size: 14px; }
  .words li .ml { margin-left: 4px; }

  .empty {
    text-align: center; padding: 48px 20px; background: var(--surface);
    border: 1px dashed var(--border); border-radius: var(--radius); color: var(--muted);
  }
  .empty h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
  .empty p { margin: 4px 0; }
  .empty code { background: var(--surface-2); padding: 1px 6px; border-radius: 5px; font-size: 14px; }

  mark { background: #ffe58a; color: inherit; border-radius: 3px; padding: 0 1px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) mark { background: #6b5a12; } }
  :root[data-theme="dark"] mark { background: #6b5a12; }

  footer { color: var(--muted); font-size: 13px; padding: 24px 0 40px; border-top: 1px solid var(--border); }
  footer a { color: var(--accent); }

  @media (max-width: 520px) {
    .list li { grid-template-columns: 1fr; }
    .list .dayno { display: flex; gap: 8px; align-items: baseline; }
    .list .dayno b { display: inline; }
    .toolbar .search { flex-basis: 100%; }
    .toolbar .seg { flex: 1; }
    .toolbar .seg button { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">The Hindu · Headline notes</div>
    <h1>100 Days of The Hindu</h1>
    <p class="sub">Short notes on the day's headlines, each with its Malayalam meaning. <span class="ml">തലക്കെട്ടുകളും മലയാളം അർത്ഥവും.</span></p>
    <div class="stats" id="stats"></div>
    <div class="progress" aria-hidden="true"><span id="bar"></span></div>
  </header>

  <div class="toolbar">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search titles, meanings, notes… / തിരയുക" aria-label="Search">
    </label>
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="list" aria-pressed="true">List</button>
      <button type="button" data-view="detail" aria-pressed="false">Detailed</button>
    </div>
    <button type="button" class="icon-btn" id="toggleAll" hidden>Expand all</button>
    <button type="button" class="icon-btn" id="theme" aria-label="Toggle theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:block"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </div>

  <main id="main"></main>

  <footer>
    Headlines are from <a href="https://www.thehindu.com/" rel="noopener">The Hindu</a>; the notes and Malayalam meanings are study aids written for this page.
  </footer>
</div>

<script src="notes.js"></script>
<script>
(function () {
  const TOTAL_DAYS = 100;
  const notes = (Array.isArray(window.NOTES) ? window.NOTES : [])
    .slice()
    .sort((a, b) => (a.day || 0) - (b.day || 0));

  const $ = (s) => document.querySelector(s);
  const main = $("#main");
  const q = $("#q");
  const toggleAll = $("#toggleAll");

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // Theme
  const savedTheme = store.get("theme");
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $("#theme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    store.set("theme", next);
  });

  // Stats
  const totalItems = notes.reduce((n, d) => n + (d.items ? d.items.length : 0), 0);
  $("#stats").innerHTML =
    `<span class="stat"><b>${notes.length}</b> / ${TOTAL_DAYS} days</span>` +
    `<span class="stat"><b>${totalItems}</b> headlines</span>`;
  $("#bar").style.width = Math.min(100, notes.length / TOTAL_DAYS * 100) + "%";

  // Helpers
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let term = "";
  const hl = (s) => {
    const e = esc(s);
    if (!term) return e;
    const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    return e.replace(re, (m) => `<mark>${m}</mark>`);
  };
  const fmtDate = (iso) => {
    if (!iso) return "";
    const d = new Date(iso + "T00:00:00");
    return isNaN(d) ? iso : d.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  };
  const title = (it) => it.url
    ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${hl(it.title)}</a>`
    : hl(it.title);
  const matches = (it) => {
    if (!term) return true;
    const hay = [it.title, it.ml, it.note, it.noteMl, it.section,
      ...(it.words || []).flatMap((w) => [w.en, w.ml])].join(" ").toLowerCase();
    return hay.includes(term.toLowerCase());
  };
  const filtered = () => notes
    .map((d) => ({ ...d, items: (d.items || []).filter(matches) }))
    .filter((d) => d.items.length);

  // Views
  let view = store.get("view") === "detail" ? "detail" : "list";

  function emptyState() {
    if (!notes.length) {
      return `<div class="empty">
        <h2>No notes yet</h2>
        <p class="ml">കുറിപ്പുകൾ ഇതുവരെ ചേർത്തിട്ടില്ല.</p>
        <p>Add days to <code>notes.js</code> and they will show up here.</p>
      </div>`;
    }
    return `<div class="empty"><h2>Nothing matches “${esc(term)}”</h2><p>Try another word.</p></div>`;
  }

  function renderList(days) {
    const rows = days.flatMap((d) => d.items.map((it) => `
      <li>
        <div class="dayno"><b>Day ${d.day}</b>${esc(fmtDate(d.date))}</div>
        <div>
          <div class="t">${title(it)}${it.section ? `<span class="tag">${esc(it.section)}</span>` : ""}</div>
          ${it.ml ? `<div class="ml">${hl(it.ml)}</div>` : ""}
        </div>
      </li>`)).join("");
    return `<ul class="list">${rows}</ul>`;
  }

  function renderDetail(days) {
    const open = !!term;
    return `<div class="acc">${days.map((d) => `
      <details class="day"${open ? " open" : ""}>
        <summary>
          <span class="badge">${d.day}</span>
          <span class="sum-main">
            <span class="d">Day ${d.day}${d.date ? " · " + esc(fmtDate(d.date)) : ""}</span>
            <span class="c">${d.items.length} headline${d.items.length === 1 ? "" : "s"} · ${esc(d.items[0].title)}</span>
          </span>
          <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <div class="items">${d.items.map((it) => `
          <article class="item">
            <h3>${title(it)}${it.section ? `<span class="tag">${esc(it.section)}</span>` : ""}</h3>
            ${it.ml ? `<p class="ml mean">${hl(it.ml)}</p>` : ""}
            ${it.note ? `<p class="note">${hl(it.note)}</p>` : ""}
            ${it.noteMl ? `<p class="ml noteml">${hl(it.noteMl)}</p>` : ""}
            ${it.words && it.words.length ? `<ul class="words">${it.words.map((w) =>
              `<li>${hl(w.en)}<span class="ml">${hl(w.ml)}</span></li>`).join("")}</ul>` : ""}
          </article>`).join("")}
        </div>
      </details>`).join("")}</div>`;
  }

  function render() {
    const days = filtered();
    document.querySelectorAll(".seg button").forEach((b) =>
      b.setAttribute("aria-pressed", String(b.dataset.view === view)));
    toggleAll.hidden = view !== "detail" || !days.length;
    if (!days.length) { main.innerHTML = emptyState(); return; }
    main.innerHTML = view === "list" ? renderList(days) : renderDetail(days);
    syncToggle();
  }

  function syncToggle() {
    const all = [...main.querySelectorAll("details.day")];
    toggleAll.textContent = all.length && all.every((d) => d.open) ? "Collapse all" : "Expand all";
  }

  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    view = b.dataset.view; store.set("view", view); render();
  }));
  toggleAll.addEventListener("click", () => {
    const all = [...main.querySelectorAll("details.day")];
    const openAll = !all.every((d) => d.open);
    all.forEach((d) => (d.open = openAll));
    syncToggle();
  });
  main.addEventListener("toggle", syncToggle, true);
  let t;
  q.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { term = q.value.trim(); render(); }, 120); });

  render();
})();
</script>
</body>
</html>
